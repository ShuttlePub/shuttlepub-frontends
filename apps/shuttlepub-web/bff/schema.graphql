# GraphQL SDL owned by apps/shuttlepub-web (the BFF data API for the PureScript client).
#
# This file is HAND-WRITTEN and is the single source of truth for the app's data API.
# PureScript types in src/Generated/ are generated from it (bun run codegen).
#
# The REST contract with the ShuttlePub backend is a separate, pinned artifact:
# openapi/shuttlepub.json. Resolvers reach it only through the typed adapter in
# bff/rest/. A backend answer of 501 (not implemented) is surfaced as an error with
# extensions.code = NOT_IMPLEMENTED; it is never converted into data.

"""Which data source the BFF was started with. Fixed at startup; never switches at runtime."""
enum ApiMode {
  MOCK
  REAL
}

"""Maps GET /api/v1/status (operation getApiStatus)."""
type ApiStatus {
  apiVersion: String!
}

"""An owned Emumet integrated Account/Profile. id is its public Account nanoid; the current API does not expose an internal Profile id."""
type Profile {
  id: ID!
  handle: String!
  displayName: String!
}

"""The Profile the viewer is currently acting as. Null when there is none."""
type ProfileContext {
  activeProfile: Profile
}

# --- Timeline / posts (PROVISIONAL) -------------------------------------------------
# The pinned OpenAPI has the S8 personal domain content contract (which items a Profile
# sees, how one post is presented) but no endpoint for the posts' display data (author,
# time, counts), threads or user pages. These types are owned by this app; in mock mode
# what they show goes through the S8 projection (bff/rest/content-mock.ts), in real mode
# every field below fails with extensions.code = NOT_IMPLEMENTED (no invented data).
# profile is the Profile context id the page shows (see setDomainControl); the Profile's
# Emumet domain controls decide what is hidden. Reaction data (D03) is added below.

"""PROVISIONAL. Which timeline to read."""
enum TimelineKind {
  HOME
  LOCAL
  FEDERATED
}

"""PROVISIONAL placeholder mirroring Misskey. ShuttlePub's visibility model is undecided."""
enum PostVisibility {
  PUBLIC
  HOME
  FOLLOWERS
  DIRECT
}

"""PROVISIONAL. The author of a post. handle is user@host without the leading @."""
type PostAuthor {
  id: ID!
  handle: String!
  displayName: String!
  """Canonical actor URL: what an individual mute/block of this person names."""
  actorUrl: String!
  """Host of actorUrl: the only domain whose mute/block applies to this person (S8 exact match)."""
  domain: String!
  """On this server: its domain cannot be muted or blocked."""
  local: Boolean!
}

"""S8 ContentRestriction: an independent gate. A reveal never clears it and none of the gated content is sent."""
enum ContentRestriction {
  CW
  SENSITIVE
  DELETED
  VISIBILITY
}

"""A Profile's domain control as S8 reports it on content: mode, the exact domain and the E8 revision. Nothing else about the item."""
type ContentControl {
  mode: PolicyMode!
  domain: String!
  revision: Int!
}

"""S8 HiddenCause: why a note is hidden on direct open. DIRECT = its own author's domain is controlled; QUOTE = it directly quotes a note of a controlled domain (the control is the quoted source's)."""
enum HiddenCause {
  DIRECT
  QUOTE
}

"""S8 NotePresentation hidden: the cause and the control that caused it. Only a hidden note carries a cause (ContentControl elsewhere has none)."""
type HiddenContent {
  cause: HiddenCause!
  control: ContentControl!
}

"""
S8 EmbeddedNotePresentation of a revealed quote's target: exactly one of post / restriction.
There is no hidden variant: a controlled target hides the whole quote (HiddenContent QUOTE).
"""
type QuotedPost {
  post: Post
  restriction: ContentRestriction
}

"""S8 EmojiReactionCount: a chip of the note's reactions. emoji carries the chip's view data (origin, image state, usage)."""
type ReactionChip {
  emoji: Emoji!
  count: Int!
}

"""S8 ReactionCounts of a visible note: accepted historical counts (not reduced by a block)."""
type ReactionCounts {
  likes: Int!
  emoji: [ReactionChip!]!
}

"""S8 PostOperationAvailability (domain part only): null = not refused by a domain block; set = the block that refuses it."""
type PostOperations {
  reply: ContentControl
  quote: ContentControl
  repost: ContentControl
  like: ContentControl
  emojiReaction: ContentControl
}

"""
One post seen directly (S8 DirectNoteResponse), by its provisional id. Exactly one of post /
hidden / restriction is set. hidden carries only the cause and the control (no text, author
or quote). operations accompany a visible or restricted post; a reveal never clears a block.
reactionCounts accompany a visible post.
"""
type PostView {
  id: ID!
  post: Post
  hidden: HiddenContent
  restriction: ContentRestriction
  operations: PostOperations
  reactionCounts: ReactionCounts
}

"""PROVISIONAL. A person's page (ui-spec 3-6): the person is always shown, their posts are hidden while control is set."""
type UserPage {
  author: PostAuthor!
  bio: String!
  """The Profile's control on the person's domain (the badge)."""
  control: ContentControl
  """Set while the posts are hidden (posts is then empty)."""
  hidden: ContentControl
  posts: [PostView!]!
}

"""PROVISIONAL. A post as shown on a timeline or the post detail screen."""
type Post {
  id: ID!
  """The ShuttlePub Note id (UUID) behind the post: the noteId of the quick reaction operations."""
  noteId: ID!
  author: PostAuthor!
  text: String!
  """ISO 8601 instant."""
  createdAt: String!
  replyCount: Int!
  repostCount: Int!
  """Set when this timeline entry is someone's repost."""
  repostedBy: PostAuthor
  inReplyToId: ID
  """Set for a quote: its target (S8 EmbeddedNotePresentation)."""
  quoted: QuotedPost
}

"""PROVISIONAL. Input of the compose form."""
input CreatePostInput {
  text: String!
  visibility: PostVisibility!
}

# --- Quick reaction (D03) ------------------------------------------------------------
# Maps the S3 contract (operations tagged quick-reaction in openapi/shuttlepub.json):
# per posting Profile favourites (GET/PUT .../quick-reaction-settings) and the
# Profile's single reaction on a Note (GET/PUT/DELETE .../notes/{note_id}/reaction).
# profileId is the acting Profile (it must be one of availableProfiles). A 409 is
# extensions.code = REVISION_CONFLICT (with extensions.currentRevision), a 422 is
# EMOJI_UNAVAILABLE, a 422 emoji_usage_not_allowed (an external emoji without a chip on the
# Note, or as a favourite) is EMOJI_USAGE_NOT_ALLOWED, a 409 conflict on the reaction PUT (an
# external emoji while another reaction is selected) is CONFLICT, a 501 is NOT_IMPLEMENTED. ReactionGroup / Reactor and
# customEmojis are PROVISIONAL: no endpoint exists, real mode answers NOT_IMPLEMENTED.

"""EmojiRef.type."""
enum EmojiKind {
  UNICODE
  CUSTOM
}

"""EmojiUnavailableReason."""
enum EmojiUnavailableReason {
  DELETED
  DISABLED
}

"""EmojiImageState: whether the image of a custom emoji can be shown (independent of availability)."""
enum EmojiImageState {
  PRESENT
  MISSING
}

"""EmojiUsage: where a custom emoji may be used. EXISTING_REACTION_ONLY is an external emoji."""
enum EmojiUsage {
  EXISTING_REACTION_ONLY
  ANYWHERE
}

"""Maps EmojiView. value is the Unicode sequence (UNICODE) or the stable custom emoji id (CUSTOM)."""
type Emoji {
  kind: EmojiKind!
  value: String!
  """Custom emoji only, without colons."""
  shortcode: String
  """
  Image of this server's own custom emoji only, absent once deleted. Always null for an external
  emoji (origin set): its image lives on another server and the browser never loads it directly
  (d09-q06; the contract has no ShuttlePub-side delivery route), so the UI shows :shortcode: with
  the external mark.
  """
  imageUrl: String
  available: Boolean!
  unavailableReason: EmojiUnavailableReason
  """Originating domain of an external custom emoji; null for Unicode and this server's own emoji, so a value is the external mark."""
  origin: String
  """Custom emoji only (null for Unicode). MISSING means show :shortcode:; PRESENT goes with imageUrl for this server's emoji (an external emoji is shown as :shortcode: either way)."""
  imageState: EmojiImageState
  """Custom emoji only; null means ANYWHERE (Unicode). An external emoji is EXISTING_REACTION_ONLY."""
  usage: EmojiUsage
}

"""Maps EmojiRef."""
input EmojiInput {
  kind: EmojiKind!
  value: String!
}

"""Maps QuickReactionSettings of one Profile. revision 0 = never saved."""
type QuickReactionSettings {
  profileId: ID!
  revision: Int!
  favorites: [Emoji!]!
}

"""Maps ReactionState: the acting Profile's reaction on a Note (null = not reacted)."""
type NoteReaction {
  profileId: ID!
  noteId: ID!
  emoji: Emoji
}

"""PROVISIONAL. Someone who reacted. handle is user@host without the leading @."""
type Reactor {
  id: ID!
  handle: String!
  displayName: String!
}

"""PROVISIONAL. One emoji's reactions by other people (the acting Profile's own excluded)."""
type ReactionGroup {
  emoji: Emoji!
  count: Int!
  reactors: [Reactor!]!
}

"""Reactions on a Note seen by one Profile: mine (S3) and other people's (PROVISIONAL)."""
type PostReactions {
  profileId: ID!
  noteId: ID!
  mine: Emoji
  others: [ReactionGroup!]!
}

"""
Mute or block (personal-domain-controls). Settings belong to one Profile and never apply to
other Profiles or Accounts. A block also detaches existing follows in both directions in
Emumet; removing it restores nothing.
"""
enum PolicyMode {
  MUTE
  BLOCK
}

"""
Exact-match domain control of the selected Profile (Emumet domain-controls). domain is
Emumet's normalized form; example.com does not cover sub.example.com.
"""
type DomainControl {
  domain: String!
  mode: PolicyMode!
  """Send back as expectedRevision to replace or remove exactly this state."""
  revision: Int!
  createdAt: String!
}

"""Emumet ProfileRelationActorKind: whether a target lives on this server or a remote one."""
enum RelationActorKind {
  LOCAL
  REMOTE
}

"""Emumet ProfileRelationActorStatus: whether display information of a target is available."""
enum RelationActorStatus {
  RESOLVED
  PENDING
  UNAVAILABLE
}

"""
Display information of the target of an individual mute/block (Emumet ProfileRelationActor),
served from the Profile (local) or a server-side cache; the list never contacts a remote server.
Absent fields are null and never derived from actorUrl: a PENDING (fetch started) or UNAVAILABLE
target has no name/icon/acct and the UI falls back to actorUrl.
"""
type RelationActor {
  kind: RelationActorKind!
  """Canonical actor URL; always equal to the policy's actorUrl."""
  actorUrl: String!
  status: RelationActorStatus!
  displayName: String
  """
  Absolute http(s) URL of the avatar as stored. For a remote actor it points at another server,
  which the browser must not load directly (d09-q06: no ShuttlePub-side delivery route exists, so a
  placeholder icon is shown); how the screen uses it is decided by the D08 display unit.
  """
  iconUrl: String
  """preferred_username@host without a leading @."""
  acct: String
  preferredUsername: String
  """Profile nanoid; set only when kind is LOCAL."""
  profileId: String
}

"""Individual mute/block of the selected Profile (list and create answers alike carry targetActor)."""
type ActorPolicy {
  id: ID!
  mode: PolicyMode!
  actorUrl: String!
  targetActor: RelationActor!
  createdAt: String!
}

"""Existing follows of the selected Profile with actors on exactly this domain (canonical actor URLs)."""
type DomainBlockImpact {
  domain: String!
  following: [String!]!
  followers: [String!]!
}

"""Why a typed domain was refused before anything was sent to Emumet."""
enum DomainInputError {
  EMPTY
  WILDCARD
  INVALID
  IP_ADDRESS
  OWN_SERVER
}

"""Result of normalizing what the viewer typed: exactly one of domain / error is set."""
type DomainInputCheck {
  domain: String
  error: DomainInputError
}

"""A removed setting: the domain or the actor policy id."""
type PolicyRemoval {
  key: String!
}

type Mutation {
  """Select an identity from the current viewer's owned Emumet accounts (integrated Profile API)."""
  selectProfile(id: ID!): ProfileContext!
  """PROVISIONAL. Always NOT_IMPLEMENTED (both modes) until the backend publishes a contract."""
  createPost(input: CreatePostInput!): Post!
  """PUT .../quick-reaction-settings (full replacement guarded by expectedRevision)."""
  updateQuickReactionSettings(profileId: ID!, expectedRevision: Int!, favorites: [EmojiInput!]!): QuickReactionSettings!
  """PUT .../notes/{noteId}/reaction."""
  setNoteReaction(profileId: ID!, noteId: ID!, emoji: EmojiInput!): NoteReaction!
  """DELETE .../notes/{noteId}/reaction (succeeds also for an unavailable emoji)."""
  removeNoteReaction(profileId: ID!, noteId: ID!): NoteReaction!
  """
  Create (expectedRevision omitted) or replace (expectedRevision = current revision) a domain
  control of the selected Profile. profile is the Profile context id the client is showing;
  a different selection fails with PROFILE_CHANGED. Conflicts fail with REVISION_CONFLICT.
  """
  setDomainControl(profile: ID!, domain: String!, mode: PolicyMode!, expectedRevision: Int): DomainControl!
  removeDomainControl(profile: ID!, domain: String!, expectedRevision: Int!): PolicyRemoval!
  addActorPolicy(profile: ID!, actorUrl: String!, mode: PolicyMode!): ActorPolicy!
  removeActorPolicy(profile: ID!, id: ID!, mode: PolicyMode!): PolicyRemoval!
  """S8 POST .../notes/{noteId}/reveal: this one post for the current page only. Null when it does not exist."""
  revealPost(profile: ID, id: ID!): PostView
  """A person's page with each of their posts revealed on its own (S8 single-note reveal)."""
  revealUserPage(profile: ID, handle: String!): UserPage
}

type Query {
  availableProfiles: [Profile!]!
  apiMode: ApiMode!
  apiStatus: ApiStatus!
  profileContext: ProfileContext!
  """PROVISIONAL. Newest first; items the Profile's controls suppress are left out without trace (S8)."""
  timeline(profile: ID, kind: TimelineKind!): [Post!]!
  """S8 GET .../notes/{noteId} (initially hidden for a controlled domain). Null when the post does not exist."""
  postView(profile: ID, id: ID!): PostView
  """PROVISIONAL. Direct replies, oldest first, each as its S8 direct view."""
  replies(profile: ID, postId: ID!): [PostView!]!
  """PROVISIONAL. A person's page; null when unknown."""
  userPage(profile: ID, handle: String!): UserPage
  """GET .../quick-reaction-settings."""
  quickReactionSettings(profileId: ID!): QuickReactionSettings!
  """Reactions on each Note (at most 100), in the order asked."""
  postReactions(profileId: ID!, noteIds: [ID!]!): [PostReactions!]!
  """PROVISIONAL. The server's custom emoji (available or not)."""
  customEmojis: [Emoji!]!
  """Domain controls of the selected Profile, newest first. profile: see setDomainControl."""
  domainControls(profile: ID!): [DomainControl!]!
  """Individual mutes/blocks of the selected Profile, newest first."""
  actorPolicies(profile: ID!): [ActorPolicy!]!
  """Follows that a block of this exact domain would detach (pending and accepted)."""
  domainBlockImpact(profile: ID!, domain: String!): DomainBlockImpact!
  """Follows with exactly this actor that an individual block would detach (domain = the actor's host)."""
  actorBlockImpact(profile: ID!, actorUrl: String!): DomainBlockImpact!
  """Normalizes a typed domain (URL, @user@host, path, port, case, trailing dot, IDN)."""
  checkDomainInput(input: String!): DomainInputCheck!
}
