# GraphQL SDL owned by apps/shuttlepub-web (the BFF data API for the PureScript client).
#
# This file is HAND-WRITTEN and is the single source of truth for the app's data API.
# PureScript types in src/Generated/ are generated from it (bun run codegen).
#
# The REST contract with the ShuttlePub backend is a separate, pinned artifact:
# openapi/shuttlepub.json. Resolvers reach it only through the typed adapter in
# bff/rest/. A backend answer of 501 (not implemented) is surfaced as an error with
# extensions.code = NOT_IMPLEMENTED; it is never converted into data.

"""Which data source the BFF was started with. Fixed at startup; never switches at runtime."""
enum ApiMode {
  MOCK
  REAL
}

"""Maps GET /api/v1/status (operation getApiStatus)."""
type ApiStatus {
  apiVersion: String!
}

"""An owned Emumet integrated Account/Profile. id is its public Account nanoid; the current API does not expose an internal Profile id."""
type Profile {
  id: ID!
  handle: String!
  displayName: String!
}

"""The Profile the viewer is currently acting as. Null when there is none."""
type ProfileContext {
  activeProfile: Profile
}

# --- Timeline / posts (PROVISIONAL) -------------------------------------------------
# The pinned OpenAPI schema has no timeline/post endpoint yet. These types are owned by
# this app so the screen layout can be built against mock fixtures; in real mode every
# field below fails with extensions.code = NOT_IMPLEMENTED (no invented data).
# Reaction data (D03) is added by the quick-reaction section below.

"""PROVISIONAL. Which timeline to read."""
enum TimelineKind {
  HOME
  LOCAL
  FEDERATED
}

"""PROVISIONAL placeholder mirroring Misskey. ShuttlePub's visibility model is undecided."""
enum PostVisibility {
  PUBLIC
  HOME
  FOLLOWERS
  DIRECT
}

"""PROVISIONAL. The author of a post. handle is user@host without the leading @."""
type PostAuthor {
  id: ID!
  handle: String!
  displayName: String!
}

"""PROVISIONAL. A post as shown on a timeline or the post detail screen."""
type Post {
  id: ID!
  """The ShuttlePub Note id (UUID) behind the post: the noteId of the quick reaction operations."""
  noteId: ID!
  author: PostAuthor!
  text: String!
  """ISO 8601 instant."""
  createdAt: String!
  replyCount: Int!
  repostCount: Int!
  """Set when this timeline entry is someone's repost."""
  repostedBy: PostAuthor
  inReplyToId: ID
}

"""PROVISIONAL. Input of the compose form."""
input CreatePostInput {
  text: String!
  visibility: PostVisibility!
}

# --- Quick reaction (D03) ------------------------------------------------------------
# Maps the S3 contract (operations tagged quick-reaction in openapi/shuttlepub.json):
# per posting Profile favourites (GET/PUT .../quick-reaction-settings) and the
# Profile's single reaction on a Note (GET/PUT/DELETE .../notes/{note_id}/reaction).
# profileId is the acting Profile (it must be one of availableProfiles). A 409 is
# extensions.code = REVISION_CONFLICT (with extensions.currentRevision), a 422 is
# EMOJI_UNAVAILABLE, a 501 is NOT_IMPLEMENTED. ReactionGroup / Reactor and
# customEmojis are PROVISIONAL: no endpoint exists, real mode answers NOT_IMPLEMENTED.

"""EmojiRef.type."""
enum EmojiKind {
  UNICODE
  CUSTOM
}

"""EmojiUnavailableReason."""
enum EmojiUnavailableReason {
  DELETED
  DISABLED
}

"""Maps EmojiView. value is the Unicode sequence (UNICODE) or the stable custom emoji id (CUSTOM)."""
type Emoji {
  kind: EmojiKind!
  value: String!
  """Custom emoji only, without colons."""
  shortcode: String
  """Custom emoji only, absent once deleted."""
  imageUrl: String
  available: Boolean!
  unavailableReason: EmojiUnavailableReason
}

"""Maps EmojiRef."""
input EmojiInput {
  kind: EmojiKind!
  value: String!
}

"""Maps QuickReactionSettings of one Profile. revision 0 = never saved."""
type QuickReactionSettings {
  profileId: ID!
  revision: Int!
  favorites: [Emoji!]!
}

"""Maps ReactionState: the acting Profile's reaction on a Note (null = not reacted)."""
type NoteReaction {
  profileId: ID!
  noteId: ID!
  emoji: Emoji
}

"""PROVISIONAL. Someone who reacted. handle is user@host without the leading @."""
type Reactor {
  id: ID!
  handle: String!
  displayName: String!
}

"""PROVISIONAL. One emoji's reactions by other people (the acting Profile's own excluded)."""
type ReactionGroup {
  emoji: Emoji!
  count: Int!
  reactors: [Reactor!]!
}

"""Reactions on a Note seen by one Profile: mine (S3) and other people's (PROVISIONAL)."""
type PostReactions {
  profileId: ID!
  noteId: ID!
  mine: Emoji
  others: [ReactionGroup!]!
}

"""
Mute or block (personal-domain-controls). Settings belong to one Profile and never apply to
other Profiles or Accounts. A block also detaches existing follows in both directions in
Emumet; removing it restores nothing.
"""
enum PolicyMode {
  MUTE
  BLOCK
}

"""
Exact-match domain control of the selected Profile (Emumet domain-controls). domain is
Emumet's normalized form; example.com does not cover sub.example.com.
"""
type DomainControl {
  domain: String!
  mode: PolicyMode!
  """Send back as expectedRevision to replace or remove exactly this state."""
  revision: Int!
  createdAt: String!
}

"""Individual mute/block of the selected Profile. Emumet exposes only the target's canonical actor URL."""
type ActorPolicy {
  id: ID!
  mode: PolicyMode!
  actorUrl: String!
  createdAt: String!
}

"""Existing follows of the selected Profile with actors on exactly this domain (canonical actor URLs)."""
type DomainBlockImpact {
  domain: String!
  following: [String!]!
  followers: [String!]!
}

"""Why a typed domain was refused before anything was sent to Emumet."""
enum DomainInputError {
  EMPTY
  WILDCARD
  INVALID
  IP_ADDRESS
  OWN_SERVER
}

"""Result of normalizing what the viewer typed: exactly one of domain / error is set."""
type DomainInputCheck {
  domain: String
  error: DomainInputError
}

"""A removed setting: the domain or the actor policy id."""
type PolicyRemoval {
  key: String!
}

type Mutation {
  """Select an identity from the current viewer's owned Emumet accounts (integrated Profile API)."""
  selectProfile(id: ID!): ProfileContext!
  """PROVISIONAL. Always NOT_IMPLEMENTED (both modes) until the backend publishes a contract."""
  createPost(input: CreatePostInput!): Post!
  """PUT .../quick-reaction-settings (full replacement guarded by expectedRevision)."""
  updateQuickReactionSettings(profileId: ID!, expectedRevision: Int!, favorites: [EmojiInput!]!): QuickReactionSettings!
  """PUT .../notes/{noteId}/reaction."""
  setNoteReaction(profileId: ID!, noteId: ID!, emoji: EmojiInput!): NoteReaction!
  """DELETE .../notes/{noteId}/reaction (succeeds also for an unavailable emoji)."""
  removeNoteReaction(profileId: ID!, noteId: ID!): NoteReaction!
  """
  Create (expectedRevision omitted) or replace (expectedRevision = current revision) a domain
  control of the selected Profile. profile is the Profile context id the client is showing;
  a different selection fails with PROFILE_CHANGED. Conflicts fail with REVISION_CONFLICT.
  """
  setDomainControl(profile: ID!, domain: String!, mode: PolicyMode!, expectedRevision: Int): DomainControl!
  removeDomainControl(profile: ID!, domain: String!, expectedRevision: Int!): PolicyRemoval!
  addActorPolicy(profile: ID!, actorUrl: String!, mode: PolicyMode!): ActorPolicy!
  removeActorPolicy(profile: ID!, id: ID!, mode: PolicyMode!): PolicyRemoval!
}

type Query {
  availableProfiles: [Profile!]!
  apiMode: ApiMode!
  apiStatus: ApiStatus!
  profileContext: ProfileContext!
  """PROVISIONAL. Newest first."""
  timeline(kind: TimelineKind!): [Post!]!
  """PROVISIONAL. Null when the post does not exist."""
  post(id: ID!): Post
  """PROVISIONAL. Direct replies, oldest first."""
  replies(postId: ID!): [Post!]!
  """GET .../quick-reaction-settings."""
  quickReactionSettings(profileId: ID!): QuickReactionSettings!
  """Reactions on each Note (at most 100), in the order asked."""
  postReactions(profileId: ID!, noteIds: [ID!]!): [PostReactions!]!
  """PROVISIONAL. The server's custom emoji (available or not)."""
  customEmojis: [Emoji!]!
  """Domain controls of the selected Profile, newest first. profile: see setDomainControl."""
  domainControls(profile: ID!): [DomainControl!]!
  """Individual mutes/blocks of the selected Profile, newest first."""
  actorPolicies(profile: ID!): [ActorPolicy!]!
  """Follows that a block of this exact domain would detach (pending and accepted)."""
  domainBlockImpact(profile: ID!, domain: String!): DomainBlockImpact!
  """Normalizes a typed domain (URL, @user@host, path, port, case, trailing dot, IDN)."""
  checkDomainInput(input: String!): DomainInputCheck!
}
