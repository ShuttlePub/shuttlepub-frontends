scalar DateTime

type Account {
  id: ID!
  name: String!
  isBot: Boolean!
  "Emumet は Account 単位の鍵を返さない (Profile モデル移行で廃止)。実 Emumet 接続時は値を持たず常に空文字。画面側の非表示・nullable 化は画面 PR"
  publicKey: String!
  createdAt: DateTime!
  moderation: Moderation
  profile: Profile
  metadata: [Metadata!]!
  "この Account を記述する Profile の nanoid (組織 Account は最小 id の Profile)。Profile を持たない場合は null"
  profileId: ID
  "profileId の Profile の username。profileId があるのに null なら未設定 (一回限り設定できる)。Account 名から導出しない"
  profileUsername: String
}

enum ModerationType {
  SUSPENDED
  BANNED
}

type Moderation {
  type: ModerationType!
  reason: String!
  suspendedAt: DateTime
  expiresAt: DateTime
  bannedAt: DateTime
}

type Profile {
  nanoid: ID!
  accountId: ID!
  displayName: String
  summary: String
  iconUrl: String
  bannerUrl: String
  "acct の名前部分。一度だけ設定でき、変更できない。未設定 (既存 Profile) は null。Account 名や所有者 (移管先) から導出しない"
  username: String
  "username の状態。UNSET なら setProfileUsername で一回限り設定できる。SET は変更不可"
  usernameState: ProfileUsernameState!
}

"Account の fields の 1 件。nanoid は fields 内の位置 (0 始まりの index)。削除すると後続の位置が繰り上がる"
type Metadata {
  nanoid: ID!
  accountId: ID!
  label: String!
  content: String!
}

type AccountConnection {
  items: [Account!]!
  first: String
  last: String
}

input CreateAccountInput {
  name: String!
  isBot: Boolean
  "Profile の username (Account 名とは別入力)。新 UI は必ず送る。省略は旧経路との互換のための暂定 (画面実装 PR で String! にする)"
  username: String
}

input UpdateProfileInput {
  displayName: String
  summary: String
  iconUrl: String
  bannerUrl: String
}

input UpsertMetadataInput {
  label: String!
  content: String!
}

type Query {
  accounts: AccountConnection!
  account(id: ID!): Account
}

type Mutation {
  createAccount(input: CreateAccountInput!): Account!
  updateProfile(accountId: ID!, input: UpdateProfileInput!): Profile!
  "実 Emumet 接続時は未対応 (UNSUPPORTED): fields の項目 ID・revision が Emumet に無く安全に書けない (後続課題)"
  createMetadata(accountId: ID!, input: UpsertMetadataInput!): Metadata!
  "実 Emumet 接続時は未対応 (UNSUPPORTED): fields の項目 ID・revision が Emumet に無く安全に書けない (後続課題)"
  updateMetadata(accountId: ID!, nanoid: ID!, input: UpsertMetadataInput!): Metadata!
  "実 Emumet 接続時は未対応 (UNSUPPORTED): fields の項目 ID・revision が Emumet に無く安全に書けない (後続課題)"
  deleteMetadata(accountId: ID!, nanoid: ID!): Boolean!
}

# ----------------------------------------------------------------
# 登録ゲート (D15 registration-readiness-gate) — 管理者向け。
# 認可の正本は Emumet API (instance:administrate)。BFF は権限を判断せず、
# 未認証 UNAUTHENTICATED / 権限なし FORBIDDEN / revision 競合 REVISION_CONFLICT /
# 前提条件違反 PRECONDITION_FAILED / 不正リクエスト BAD_REQUEST /
# 対象なし NOT_FOUND (再試行する failed 配送が無い等) / Webhook 未設定・設定不備 WEBHOOK_NOT_CONFIGURED /
# 一時障害 TEMPORARILY_UNAVAILABLE (extensions.retryable = true) /
# 契約違反の応答 INVALID_UPSTREAM_RESPONSE / その他の上流エラー UPSTREAM_ERROR を
# extensions.code で区別して返す。状態 (RegistrationGate) とエラーは別の型であり混同しない。
# 判定は E15d で実 Kratos 登録 (pre-persist hook) に適用される。適用証明の喪失も停止ラッチ (enforcementLostLatch)。
# secret は一切含まない。
# ----------------------------------------------------------------

"判定。ACCEPTING 受付中 / TEMPORARY_REJECT 一時拒否 (復旧で自動再開) / STOPPED 設定喪失で停止 (手動再開が必要) / ADMIN_CLOSED 管理者閉鎖"
enum RegistrationDecision {
  ACCEPTING
  ADMIN_CLOSED
  STOPPED
  TEMPORARY_REJECT
}

enum RegistrationAdminState {
  OPEN
  CLOSED
}

"継続中の健全性 episode。OUTAGE 一時障害で effective な対策が 0 件 / DEGRADED 片方のみ障害 (防御低下)"
enum RegistrationHealthEpisode {
  NONE
  OUTAGE
  DEGRADED
}

enum RegistrationProtection {
  EMAIL
  BOT
}

enum RegistrationProbeStatus {
  HEALTHY
  UNHEALTHY
  UNKNOWN
}

enum RegistrationGateEventKind {
  OUTAGE_STARTED
  OUTAGE_RECOVERED
  PROTECTION_DEGRADED
  PROTECTION_LOST_STOPPED
  OVERRIDE_STARTED
  OVERRIDE_REVOKED
  "E15d: 登録の保護の適用証明が失われて停止 (復旧後も手動再開が必要)"
  ENFORCEMENT_LOST_STOPPED
  ENFORCEMENT_RESTORED
}

type RegistrationProtectionObservation {
  configured: Boolean!
  probe: RegistrationProbeStatus!
}

type RegistrationObservation {
  "E15d: 登録の保護 (Kratos hook) が現在の deployment で適用されている証明。false の間は開放・再開・override が PRECONDITION_FAILED"
  enforcementVerified: Boolean!
  email: RegistrationProtectionObservation!
  bot: RegistrationProtectionObservation!
}

"override の状態。decision とは独立で、管理者閉鎖中でも active のまま保持される"
type RegistrationOverride {
  active: Boolean!
  activatedBy: String
  activatedAt: String
}

type RegistrationGate {
  "楽観ロック用。変更系の mutation はこの値を送り、不一致は REVISION_CONFLICT"
  revision: Int!
  adminState: RegistrationAdminState!
  decision: RegistrationDecision!
  accepting: Boolean!
  "decision が STOPPED のとき true。復旧しても自動再開しない"
  requiresManualResume: Boolean!
  configLostLatch: Boolean!
  "E15d: 適用証明の喪失による停止ラッチ (override 中でも STOPPED。復旧後も手動再開が必要)"
  enforcementLostLatch: Boolean!
  healthEpisode: RegistrationHealthEpisode!
  "登録時に課す対策 (検証 API が実際に応答した対策のみ)"
  enforcedProtections: [RegistrationProtection!]!
  "防御低下: 設定済みだが検証 API が応答しない対策"
  degradedProtections: [RegistrationProtection!]!
  override: RegistrationOverride!
  observation: RegistrationObservation!
  updatedAt: String!
  "管理画面の状態チップ (BFF が decision・adminState・revision・override から導出。registration-gate-status.ts)"
  status: RegistrationGateStatus!
  "最低条件 (メール認証か BOT 保護の少なくとも一方が設定済みかつ応答あり) を満たすか。false なら開放・再開は PRECONDITION_FAILED"
  minimumMet: Boolean!
}

"""
管理画面の状態 (ui-spec A-2)。decision を優先して決める:
STOPPED → AUTO_STOPPED / ADMIN_CLOSED → (revision 0 なら NOT_OPENED、それ以外 ADMIN_STOPPED) /
override 有効 → OVERRIDE / TEMPORARY_REJECT → TEMPORARILY_SUSPENDED / ACCEPTING → OPEN
"""
enum RegistrationGateStatus {
  NOT_OPENED
  OPEN
  TEMPORARILY_SUSPENDED
  AUTO_STOPPED
  ADMIN_STOPPED
  OVERRIDE
}

type RegistrationGateNotification {
  id: ID!
  kind: RegistrationGateEventKind!
  revision: Int!
  "override の開始・解除を実行した管理者 (auth account ID)"
  actor: String
  observation: RegistrationObservation!
  createdAt: String!
  "呼び出した管理者自身の既読状態 (管理者間で共有されない)"
  read: Boolean!
  readAt: String
}

type RegistrationGateNotificationConnection {
  notifications: [RegistrationGateNotification!]!
  "呼び出した管理者自身の未読件数 (ページ範囲ではなく全体)"
  unreadCount: Int!
  "次ページ取得用の before。最後のページでは null"
  nextCursor: String
}

extend type Query {
  registrationGate: RegistrationGate!
  "limit は 1〜100 (既定 50)、before は前ページ最後の通知 ID"
  registrationGateNotifications(limit: Int, before: String): RegistrationGateNotificationConnection!
  registrationGateUnreadCount: Int!
}

extend type Mutation {
  "開放。設定喪失で停止中の手動再開も同じ操作。最低条件 (メール認証 OR BOT 対策) を満たさなければ PRECONDITION_FAILED"
  openRegistrationGate(revision: Int!): RegistrationGate!
  closeRegistrationGate(revision: Int!): RegistrationGate!
  "acknowledgeWarning が false なら BAD_REQUEST。override は明示解除まで有効"
  enableRegistrationGateOverride(revision: Int!, acknowledgeWarning: Boolean!): RegistrationGate!
  revokeRegistrationGateOverride(revision: Int!): RegistrationGate!
  "戻り値は既読化後の未読件数"
  markRegistrationGateNotificationsRead(eventIds: [ID!]!): Int!
  markAllRegistrationGateNotificationsRead: Int!
}

"現在時刻での評価。OPERATIONAL は現在の設定に結び付いた実検証の成功が新鮮な間だけ"
enum RegistrationProtectionStatus {
  CONFIGURATION_INVALID
  OPERATIONAL
  TEMPORARILY_UNAVAILABLE
  UNVERIFIED
}

"保護 (メール認証・BOT 保護) の準備状態 (E15c)。secret・fingerprint・設定値は含まない"
type RegistrationProtectionReadiness {
  protection: RegistrationProtection!
  "設定が有効か (未設定・明示無効は false)"
  enabled: Boolean!
  status: RegistrationProtectionStatus!
  "評価の理由 (Emumet の固定語彙。例 invalid_secret / timeout)"
  reason: String!
  checkedAt: String
  validUntil: String
}

enum RegistrationProtectionVerifyOutcome {
  BUSINESS_SUCCESS
  ACCEPTED
  CONFIGURATION_INVALID
  ATTEMPT_REJECTED
  TEMPORARILY_UNAVAILABLE
}

"COMPLETED / PENDING_CONFIRMATION (canary mailbox にコードを送った) / CANARY_NOT_CONFIGURED"
enum RegistrationProtectionVerifyDisposition {
  COMPLETED
  PENDING_CONFIRMATION
  CANARY_NOT_CONFIGURED
}

type RegistrationProtectionVerification {
  outcome: RegistrationProtectionVerifyOutcome!
  reason: String!
  "readiness へ記録したか"
  recorded: Boolean!
  disposition: RegistrationProtectionVerifyDisposition!
  readiness: RegistrationProtectionReadiness!
}

"NOT_CONFIGURED (Webhook 無効。エラーではない) / MISCONFIGURED (設定不備。issue を参照) / CONFIGURED"
enum RegistrationWebhookConfiguration {
  NOT_CONFIGURED
  MISCONFIGURED
  CONFIGURED
}

enum RegistrationWebhookDeliveryStatus {
  PENDING
  IN_FLIGHT
  RETRYING
  DELIVERED
  FAILED
}

"Webhook の配送記録 (本文・宛先 URL・secret は含まない)"
type RegistrationWebhookDelivery {
  "通知イベント ID (再試行・再送で不変)"
  eventId: ID!
  eventType: RegistrationGateEventKind!
  status: RegistrationWebhookDeliveryStatus!
  attemptCount: Int!
  createdAt: String!
  lastAttemptAt: String
  deliveredAt: String
  "固定語彙の結果分類 (timeout / http_server_error など)"
  lastResult: String
  "failed のときの理由 (permanent_error / retries_exhausted)"
  failureReason: String
}

type RegistrationWebhookCounts {
  pending: Int!
  inFlight: Int!
  retrying: Int!
  delivered: Int!
  failed: Int!
}

"Webhook の配送状態 (E15w)。endpoint と secret はサーバー設定のみで、宛先は host だけを返す"
type RegistrationWebhookStatus {
  configuration: RegistrationWebhookConfiguration!
  "MISCONFIGURED のときの不備の分類 (固定語彙)"
  issue: String
  "宛先の host 部分のみ (userinfo・port・path・query・secret は出さない)"
  destinationHost: String
  counts: RegistrationWebhookCounts!
  lastSuccessAt: String
  lastFailureAt: String
  "新しい順の直近の配送記録"
  recentDeliveries: [RegistrationWebhookDelivery!]!
}

type RegistrationWebhookTestResult {
  "受信側が 2xx を返したら true"
  delivered: Boolean!
  "結果の分類 (配送記録の lastResult と同じ語彙)"
  result: String!
  httpStatus: Int
  attemptedAt: String!
}

enum InstanceRole {
  ADMIN
  MODERATOR
}

"呼び出し者 (GET /api/v1/me)。管理画面の導線を出すかのヒントで、権限判断の正本ではない (各管理 API が FORBIDDEN を返す)"
type Viewer {
  accountId: ID!
  instanceRoles: [InstanceRole!]!
  "instanceRoles に ADMIN を含む"
  isAdmin: Boolean!
}

extend type Query {
  viewer: Viewer!
  registrationProtections: [RegistrationProtectionReadiness!]!
  registrationWebhook: RegistrationWebhookStatus!
}

extend type Mutation {
  "入力なしの検証 (bot は secret の負の probe、email は canary mailbox への送信)。未知の保護は NOT_FOUND"
  verifyRegistrationProtection(protection: RegistrationProtection!): RegistrationProtectionVerification!
  "テスト送信 (1 回のみ・記録しない)。未設定・設定不備なら WEBHOOK_NOT_CONFIGURED"
  sendRegistrationWebhookTest: RegistrationWebhookTestResult!
  "eventId の failed 配送を再キューする (省略で failed 全件)。戻り値は再キュー件数。対象が無ければ NOT_FOUND"
  retryRegistrationWebhook(eventId: ID): Int!
}

# ----------------------------------------------------------------
# Profile username (profile-identity-web-adaptation / Emumet E8・P1 契約)
# 形式 ^[a-z0-9][a-z0-9._-]{0,63}$ ・予約語 17 語・暗黙の trim/小文字化なし。
# username は一度だけ設定でき、変更する mutation は存在しない。重複は削除済み Profile も含む。
# 認可の正本は Emumet API (BFF は権限を判断せず 401/403 をそのまま区別して返す)。
# 失敗は extensions.code で区別し、UI は混同しない:
#   USERNAME_INVALID_FORMAT 形式違反 / USERNAME_RESERVED 予約語 /
#   USERNAME_TAKEN 他で使用中 / USERNAME_ALREADY_SET 設定済み (一回限り) /
#   USERNAME_CONFLICT 409 だが TAKEN と ALREADY_SET を判別できない /
#   ACCOUNT_RESTRICTED 所有 Account が停止中 / UNAUTHENTICATED / FORBIDDEN / NOT_FOUND /
#   BAD_REQUEST / TEMPORARILY_UNAVAILABLE (retryable) / INVALID_UPSTREAM_RESPONSE
# 「未設定」はエラーではなく状態 (Profile.username = null / usernameState = UNSET)。
# ----------------------------------------------------------------

enum ProfileUsernameState {
  UNSET
  SET
}

"規則だけの判定結果。重複・設定済みは書き込み時にしか判明しない"
enum ProfileUsernameCheck {
  VALID
  FORMAT
  RESERVED
}

extend type Query {
  "入力中の検証用。Emumet は呼ばず規則 (形式・予約語) だけを判定する"
  checkProfileUsername(username: String!): ProfileUsernameCheck!
}

extend type Mutation {
  "username が未設定の Profile (profileId は nanoid) に一度だけ設定する。設定済みは USERNAME_ALREADY_SET"
  setProfileUsername(profileId: ID!, username: String!): Profile!
}
