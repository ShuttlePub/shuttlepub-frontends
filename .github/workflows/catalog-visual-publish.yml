name: Publish UI catalog visual diff

# Trusted checkout only; PNG-only input is re-compared before the secret-bearing step.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: catalog-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.UI_CATALOG_R2_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # workflow_run always uses trusted default-branch code, never PR scripts.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve an open PR for this exact run
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main',
              head: `${context.repo.owner}:${run.head_branch}`
            });
            const pr = prs.find(pr => pr.head.sha === run.head_sha && pr.head.repo.full_name === run.repository.full_name);
            if (!pr) { core.setFailed('No current same-repository PR matches this run'); return; }
            core.setOutput('number', pr.number);
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-catalog-screenshots
          path: apps/ui-catalog/.visual
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Recompute report from PNGs using trusted code
        run: bun visual/compare.ts
        working-directory: apps/ui-catalog
      - name: Publish report and images to R2
        run: bun visual/publish.ts
        working-directory: apps/ui-catalog
        env:
          VISUAL_KEY: run-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          VISUAL_REVISION: ${{ github.event.workflow_run.head_sha }}
          R2_ENDPOINT: ${{ vars.UI_CATALOG_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.UI_CATALOG_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.UI_CATALOG_R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.UI_CATALOG_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.UI_CATALOG_R2_SECRET_ACCESS_KEY }}
      - name: Embed images in the PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('node:fs');
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: issue_number });
            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              core.notice('Superseded run; not replacing the current PR comment'); return;
            }
            const body = fs.readFileSync('apps/ui-catalog/.visual/comment.md', 'utf8');
            if (body.length > 65000) { core.setFailed('Comment exceeds GitHub limit; split the catalog report'); return; }
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('<!-- ui-catalog-visual-diff -->'));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
