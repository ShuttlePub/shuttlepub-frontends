name: Frontend visual comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/frontend-visual*.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/frontend-visual*.yml"

permissions:
  contents: read

concurrency:
  group: frontend-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Components and application screens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: current
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}
          path: baseline
          persist-credentials: false
      - name: Record immutable capture revisions before executing frontend code
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-revisions"
          jq -n --arg head "$EXPECTED_HEAD" --arg base "$(git -C baseline rev-parse HEAD)" \
            '{version: 1, head: $head, base: $base}' > "$RUNNER_TEMP/frontend-revisions/revisions.json"
      - uses: purescript-contrib/setup-purescript@2330ad9736aba56d65964a3335fe9368c9674db8 # v3.1.0
        with:
          purescript: "0.15.15"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
        working-directory: current
      - run: bun install --frozen-lockfile
        working-directory: baseline
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: current/apps/ui-catalog
      - run: bun test
        working-directory: current/apps/ui-catalog
      - run: bunx --no-install tsc --noEmit -p visual/tsconfig.json
        working-directory: current/apps/ui-catalog
      - name: Build both revisions of all frontends
        run: |
          export PATH="$GITHUB_WORKSPACE/current/apps/ui-catalog/node_modules/.bin:$PATH"
          for side in current baseline; do
            for app in ui-catalog booskiff-web emumet-web; do
              bash current/apps/ui-catalog/visual/build.sh "$GITHUB_WORKSPACE/$side/apps/$app"
            done
          done
      - name: Capture components in the same browser environment
        working-directory: current/apps/ui-catalog
        env:
          BASE_CATALOG: ${{ github.workspace }}/baseline/apps/ui-catalog
        run: |
          PORT=3220 bun index.ts &
          current_pid=$!
          PORT=3221 bun --cwd "$BASE_CATALOG" index.ts &
          base_pid=$!
          trap 'kill "$current_pid" "$base_pid"' EXIT
          for port in 3220 3221; do
            for _attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/manifest.json" >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/manifest.json" >/dev/null
          done
          CATALOG_URL=http://127.0.0.1:3221 CAPTURE_DIR=.visual/expected bun visual/capture.ts
          CATALOG_URL=http://127.0.0.1:3220 CAPTURE_DIR=.visual/actual bun visual/capture.ts
      - name: Capture baseline application screens
        run: bun visual/screens/capture.ts
        working-directory: current/apps/ui-catalog
        env:
          FRONTEND_ROOT: ${{ github.workspace }}/baseline
          CAPTURE_DIR: ${{ github.workspace }}/current/apps/ui-catalog/.visual/expected
      - name: Capture branch application screens
        run: bun visual/screens/capture.ts
        working-directory: current/apps/ui-catalog
        env:
          FRONTEND_ROOT: ${{ github.workspace }}/current
          CAPTURE_DIR: ${{ github.workspace }}/current/apps/ui-catalog/.visual/actual
      - run: bun visual/compare.ts
        working-directory: current/apps/ui-catalog
      - name: Save visual review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-visual-report
          path: current/apps/ui-catalog/.visual/report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload PNGs for the trusted publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-screenshots
          path: |
            current/apps/ui-catalog/.visual/actual/*.png
            current/apps/ui-catalog/.visual/expected/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload capture revision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-capture-revisions
          path: ${{ runner.temp }}/frontend-revisions/revisions.json
          if-no-files-found: error
          retention-days: 7
