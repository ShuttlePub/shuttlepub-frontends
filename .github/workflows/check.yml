name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: purescript-contrib/setup-purescript@2330ad9736aba56d65964a3335fe9368c9674db8 # v3.1.0
        with:
          purescript: "0.15.15"
          purs-tidy: "latest"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: purs-tidy check apps/emumet-web/src apps/emumet-web/test packages/ui/src
        working-directory: .

      - run: bunx spago build
        working-directory: apps/emumet-web

      - run: bunx spago test
        working-directory: apps/emumet-web

      - run: bun test
        working-directory: apps/emumet-web

      - run: bun test
        working-directory: packages/auth-bun

      - run: >-
          mkdir -p dist && printf 'export function renderPage(...args: any[]): any;\n' > dist/server.d.ts
        working-directory: apps/emumet-web

      - run: bunx tsc --noEmit
        working-directory: apps/emumet-web

      - run: purs-tidy check apps/booskiff-web/src apps/booskiff-web/test
        working-directory: .

      - run: bunx spago build
        working-directory: apps/booskiff-web

      - run: bunx spago test
        working-directory: apps/booskiff-web

      - run: bun test bff/
        working-directory: apps/booskiff-web

      - run: >-
          mkdir -p dist && printf 'export function renderPage(...args: any[]): any;\n' > dist/server.d.ts
        working-directory: apps/booskiff-web

      - run: bunx tsc --noEmit
        working-directory: apps/booskiff-web

      - run: purs-tidy check apps/ui-catalog/src apps/ui-catalog/test
        working-directory: .

      - run: bunx spago build
        working-directory: apps/ui-catalog

      - run: bunx spago test
        working-directory: apps/ui-catalog

      - run: bun test
        working-directory: apps/ui-catalog

      - run: >-
          mkdir -p dist && printf 'export function renderPage(...args: any[]): any;\n' > dist/server.d.ts
        working-directory: apps/ui-catalog

      - run: bunx tsc --noEmit
        working-directory: apps/ui-catalog

  catalog-visual:
    name: UI catalog visual comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: baseline
          persist-credentials: false
      - uses: purescript-contrib/setup-purescript@2330ad9736aba56d65964a3335fe9368c9674db8 # v3.1.0
        with:
          purescript: "0.15.15"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
        working-directory: current
      - run: bun install --frozen-lockfile
        working-directory: baseline
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: current/apps/ui-catalog
      - run: bun test
        working-directory: current/apps/ui-catalog
      - run: bunx --no-install tsc --noEmit -p visual/tsconfig.json
        working-directory: current/apps/ui-catalog
      - name: Build current and base catalog
        run: |
          export PATH="$GITHUB_WORKSPACE/current/apps/ui-catalog/node_modules/.bin:$PATH"
          bash current/apps/ui-catalog/visual/build.sh "$GITHUB_WORKSPACE/current/apps/ui-catalog"
          bash current/apps/ui-catalog/visual/build.sh "$GITHUB_WORKSPACE/baseline/apps/ui-catalog"
      - name: Capture base and current in the same browser environment
        working-directory: current/apps/ui-catalog
        env:
          BASE_CATALOG: ${{ github.workspace }}/baseline/apps/ui-catalog
        run: |
          PORT=3220 bun index.ts &
          current_pid=$!
          PORT=3221 bun --cwd "$BASE_CATALOG" index.ts &
          base_pid=$!
          trap 'kill "$current_pid" "$base_pid"' EXIT
          for port in 3220 3221; do
            for _attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/manifest.json" >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/manifest.json" >/dev/null
          done
          CATALOG_URL=http://127.0.0.1:3221 CAPTURE_DIR=.visual/expected bun visual/capture.ts
          CATALOG_URL=http://127.0.0.1:3220 CAPTURE_DIR=.visual/actual bun visual/capture.ts
      - run: bun visual/compare.ts
        working-directory: current/apps/ui-catalog
      - name: Upload raw PNGs for the trusted publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-catalog-screenshots
          path: |
            current/apps/ui-catalog/.visual/actual/*.png
            current/apps/ui-catalog/.visual/expected/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
